<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ProfCheck IA</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
    body{background:#0f172a;color:#fff;min-height:100vh}
    .login{position:fixed;inset:0;background:#0f172a;display:flex;align-items:center;justify-content:center;z-index:50}
    .login-box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px;width:90%;max-width:320px}
    .login-box h2{margin-bottom:16px;text-align:center}
    .login-box input{width:100%;background:#334155;border:1px solid #475569;border-radius:8px;padding:12px;color:#fff;margin-bottom:12px}
    .login-box button{width:100%;background:#34d399;color:#0f172a;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer}
    .header{background:#1e293b;border-bottom:1px solid #334155;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
    .container{max-width:1000px;margin:0 auto;padding:24px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
    .card p:first-child{color:#94a3b8;font-size:12px;text-transform:uppercase}
    .card p:last-child{font-size:28px;font-weight:700;margin-top:4px}
    .green{color:#34d399}.blue{color:#60a5fa}.amber{color:#fbbf24}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:#334155;padding:12px;text-align:left;color:#94a3b8;font-weight:500}
    td{padding:12px;border-bottom:1px solid #334155}
    tr:hover{background:#1e293b}
    .badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
    .badge-green{background:rgba(52,211,153,.2);color:#34d399}
    .badge-gray{background:rgba(148,163,184,.2);color:#94a3b8}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="login" id="loginScreen">
    <div class="login-box">
      <h2>🔐 Admin</h2>
      <input type="password" id="adminPass" placeholder="Mot de passe">
      <button onclick="login()">Connexion</button>
      <p id="loginError" style="color:#f87171;font-size:13px;margin-top:8px;text-align:center;display:none">Mot de passe incorrect</p>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <div class="header">
      <div><strong>ProfCheck IA</strong> <span style="color:#94a3b8;font-size:13px">— Tableau de bord</span></div>
      <button onclick="logout()" style="background:none;border:none;color:#94a3b8;cursor:pointer">Déconnexion</button>
    </div>
    <div class="container">
      <div class="grid">
        <div class="card"><p>Utilisateurs total</p><p id="statTotal" class="green">--</p></div>
        <div class="card"><p>Comptes Premium</p><p id="statPremium" class="green">--</p></div>
        <div class="card"><p>Comptes Gratuits</p><p id="statFree" class="blue">--</p></div>
        <div class="card"><p>Taux conversion</p><p id="statRate" class="amber">--</p></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <strong>Utilisateurs récents</strong>
          <button onclick="loadStats()" style="background:#334155;border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px">🔄 Actualiser</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Session ID</th><th>Essais</th><th>Statut</th></tr></thead>
            <tbody id="usersTable"><tr><td colspan="3" style="text-align:center;color:#64748b;padding:24px">Chargement...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = location.origin, PASS = 'profcheck2024';
    function login(){if(document.getElementById('adminPass').value===PASS){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');loadStats();}else{document.getElementById('loginError').style.display='block';}}
    function logout(){document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden');document.getElementById('adminPass').value='';}
    async function loadStats(){
      try{
        const r=await fetch(API+'/api/admin/stats',{headers:{'Authorization':'Bearer '+PASS},credentials:'include'});
        const j=await r.json();
        if(j.success){
          const d=j.data;
          document.getElementById('statTotal').textContent=d.totalUsers;
          document.getElementById('statPremium').textContent=d.premiumUsers;
          document.getElementById('statFree').textContent=d.freeUsers;
          document.getElementById('statRate').textContent=d.totalUsers?((d.premiumUsers/d.totalUsers)*100).toFixed(1)+'%':'0%';
          const tbody=document.getElementById('usersTable');
          if(d.recentUsers&&d.recentUsers.length){
            tbody.innerHTML=d.recentUsers.map(u=>`<tr><td style="font-family:monospace;color:#64748b;font-size:12px">${u.session_id.substring(0,20)}...</td><td>${u.count}/3</td><td>${u.premium?'<span class="badge badge-green">Premium</span>':'<span class="badge badge-gray">Gratuit</span>'}</td></tr>`).join('');
          }else{tbody.innerHTML='<tr><td colspan="3" style="text-align:center;color:#64748b;padding:24px">Aucun utilisateur</td></tr>';}
        }
      }catch(e){alert('Erreur de chargement');}
    }
  </script>
</body>
</html>
