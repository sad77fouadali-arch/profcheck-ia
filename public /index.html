<!-- ========== WIDGET CHAT PROFCheck-IA ========== -->
<style>
  #profchat-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  #profchat-toggle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  #profchat-toggle:active { transform: scale(0.95); }
  #profchat-box {
    display: none;
    width: 320px;
    max-height: 450px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    flex-direction: column;
    overflow: hidden;
    margin-bottom: 10px;
    border: 1px solid #e0e0e0;
  }
  #profchat-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 14px 16px;
    font-weight: 600;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #profchat-header span { font-size: 12px; opacity: 0.9; }
  #profchat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    background: #f8f9fa;
    min-height: 280px;
    max-height: 320px;
  }
  .profchat-msg {
    margin-bottom: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.4;
    max-width: 90%;
    word-wrap: break-word;
  }
  .profchat-user {
    background: #667eea;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .profchat-bot {
    background: white;
    color: #333;
    border: 1px solid #e0e0e0;
    margin-right: auto;
    border-bottom-left-radius: 4px;
  }
  .profchat-bot strong { color: #667eea; }
  #profchat-input-area {
    display: flex;
    padding: 10px;
    background: white;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  #profchat-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 14px;
    outline: none;
  }
  #profchat-send {
    background: #667eea;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  #profchat-send:disabled { opacity: 0.6; }
  .profchat-loading {
    font-style: italic;
    color: #888;
    font-size: 12px;
    padding: 4px 12px;
  }
  @media (max-width: 480px) {
    #profchat-box { width: 90vw; right: 5vw; }
  }
</style>

<div id="profchat-widget">
  <div id="profchat-box">
    <div id="profchat-header">
      🤖 ProfCheck Assistant <span>IA pour enseignants</span>
    </div>
    <div id="profchat-messages">
      <div class="profchat-msg profchat-bot">
        <strong>Bonjour !</strong><br>
        Je suis ton assistant pédagogique. Je peux rédiger des e-mails, résumer des textes, traduire ou répondre à tes questions. Comment puis-je t'aider ?
      </div>
    </div>
    <div id="profchat-input-area">
      <input type="text" id="profchat-input" placeholder="Ex: Rédige un e-mail aux parents...">
      <button id="profchat-send" onclick="sendChat()">Envoyer</button>
    </div>
  </div>
  <button id="profchat-toggle" onclick="toggleChat()">💬</button>
</div>

<script>
  let chatHistory = [];
  
  function toggleChat() {
    const box = document.getElementById('profchat-box');
    box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    if (box.style.display === 'flex') document.getElementById('profchat-input').focus();
  }
  
  document.getElementById('profchat-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendChat();
  });
  
  async function sendChat() {
    const input = document.getElementById('profchat-input');
    const msg = input.value.trim();
    if (!msg) return;
    
    const messagesDiv = document.getElementById('profchat-messages');
    const sendBtn = document.getElementById('profchat-send');
    
    messagesDiv.innerHTML += `<div class="profchat-msg profchat-user">${escapeHtml(msg)}</div>`;
    input.value = '';
    sendBtn.disabled = true;
    
    const loadingId = 'load-' + Date.now();
    messagesDiv.innerHTML += `<div id="${loadingId}" class="profchat-loading">L'assistant réfléchit...</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, history: chatHistory })
      });
      
      const data = await res.json();
      document.getElementById(loadingId).remove();
      
      if (data.reply) {
        messagesDiv.innerHTML += `<div class="profchat-msg profchat-bot">${formatReply(data.reply)}</div>`;
        chatHistory.push({ role: 'user', content: msg });
        chatHistory.push({ role: 'assistant', content: data.reply });
        if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);
      } else {
        messagesDiv.innerHTML += `<div class="profchat-msg profchat-bot" style="color:red">Erreur de réponse. Réessaie.</div>`;
      }
    } catch (err) {
      document.getElementById(loadingId).remove();
      messagesDiv.innerHTML += `<div class="profchat-msg profchat-bot" style="color:red">Problème de connexion.</div>`;
    }
    
    sendBtn.disabled = false;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  function formatReply(text) {
    return escapeHtml(text).replace(/\n/g, '<br>');
  }
</script>
<!-- ========== FIN WIDGET CHAT ========== -->
</body>
</html>
